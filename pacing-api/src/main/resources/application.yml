pacing:
  business-zone-id: Asia/Seoul
  request-time-tolerance: 60s
  rate-update-interval: 10s
  observation:
    window: 1m
    minimum-pass-count: 20
    smoothing-factor: 0.5
    max-rate-change: 0.2
    exploration-step: 0.1
  reservation-ttl: ${PACING_RESERVATION_TTL:15m}
  state-update-max-retries: 3

  initial-rate:
    even: 0.1
    peak-weighted: 0.1
    asap: 1.0

  peak:
    start-time: "18:00"
    end-time: "23:00"
    zone-id: Asia/Seoul
    normal-weight: 0.5
    peak-weight: 1.5
    refresh-interval: 5s

  security:
    hmac:
      timestamp-tolerance: 60s
      nonce-ttl: 2m
      max-request-body-bytes: ${PACING_HMAC_MAX_REQUEST_BODY_BYTES:65536}

      clients:
        ad-server:
          current-secret-key: ${PACING_HMAC_AD_SERVER_CURRENT_SECRET}
          previous-secret-key: ${PACING_HMAC_AD_SERVER_PREVIOUS_SECRET:}
          previous-secret-valid-until: ${PACING_HMAC_AD_SERVER_PREVIOUS_SECRET_VALID_UNTIL:}
          permissions:
            - PACING_DECIDE
            - BUDGET_RESERVE

        auction-server:
          current-secret-key: ${PACING_HMAC_AUCTION_SERVER_CURRENT_SECRET}
          previous-secret-key: ${PACING_HMAC_AUCTION_SERVER_PREVIOUS_SECRET:}
          previous-secret-valid-until: ${PACING_HMAC_AUCTION_SERVER_PREVIOUS_SECRET_VALID_UNTIL:}
          permissions:
            - BUDGET_RESERVE

        operation-server:
          current-secret-key: ${PACING_HMAC_OPERATION_SERVER_CURRENT_SECRET}
          previous-secret-key: ${PACING_HMAC_OPERATION_SERVER_PREVIOUS_SECRET:}
          previous-secret-valid-until: ${PACING_HMAC_OPERATION_SERVER_PREVIOUS_SECRET_VALID_UNTIL:}
          permissions:
            - ADMIN

  infrastructure:
    redis:
      key-prefix: pacing
      campaign-cache-ttl: 30s
      campaign-cache-load-lock-ttl: 3s
      campaign-cache-load-wait-timeout: 2s
      campaign-cache-load-retry-interval: 20ms
      recovery-lock-ttl: 5s
      recovery-wait-timeout: 1s
      recovery-retry-interval: 50ms

    rate-limit:
      idle-ttl: 10m
      clients:
        ad-server:
          capacity: ${PACING_RATE_LIMIT_AD_SERVER_CAPACITY:1000}
          refill-tokens-per-second: ${PACING_RATE_LIMIT_AD_SERVER_REFILL:1000}

        auction-server:
          capacity: ${PACING_RATE_LIMIT_AUCTION_SERVER_CAPACITY:1000}
          refill-tokens-per-second: ${PACING_RATE_LIMIT_AUCTION_SERVER_REFILL:1000}

        operation-server:
          capacity: ${PACING_RATE_LIMIT_OPERATION_SERVER_CAPACITY:100}
          refill-tokens-per-second: ${PACING_RATE_LIMIT_OPERATION_SERVER_REFILL:100}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${PACING_POSTGRES_URL:jdbc:postgresql://localhost:5432/pacing}
    username: ${PACING_API_POSTGRES_USERNAME:${PACING_POSTGRES_USERNAME:pacing}}
    password: ${PACING_POSTGRES_PASSWORD:pacing}
    hikari:
      maximum-pool-size: ${PACING_DB_MAX_POOL_SIZE:20}
      minimum-idle: ${PACING_DB_MIN_IDLE:5}
      connection-timeout: 1000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${PACING_REDIS_HOST:localhost}
      port: ${PACING_REDIS_PORT:6379}
      username: ${PACING_API_REDIS_USERNAME:}
      password: ${PACING_REDIS_PASSWORD:pacing}
      connect-timeout: 500ms
      timeout: 500ms

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: pacing-api
    distribution:
      percentiles-histogram:
        pacing.api.decision: true
        pacing.api.reservation: true
