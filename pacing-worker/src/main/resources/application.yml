spring:
  application:
    name: pacing-worker

  datasource:
    url: ${PACING_POSTGRES_URL:jdbc:postgresql://localhost:5432/pacing}
    username: ${PACING_WORKER_POSTGRES_USERNAME:${PACING_POSTGRES_USERNAME:pacing}}
    password: ${PACING_POSTGRES_PASSWORD:pacing}
    hikari:
      maximum-pool-size: ${PACING_WORKER_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${PACING_WORKER_DB_MIN_IDLE:2}
      connection-timeout: 1000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${PACING_REDIS_HOST:localhost}
      port: ${PACING_REDIS_PORT:6379}
      username: ${PACING_WORKER_REDIS_USERNAME:}
      password: ${PACING_REDIS_PASSWORD:pacing}
      connect-timeout: 500ms
      timeout: 500ms

  kafka:
    bootstrap-servers: ${PACING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.settlement.pacing.worker.billing.message.BillingEventMessage
        spring.json.trusted.packages: com.settlement.pacing.worker.billing.message
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: record

server:
  port: ${PACING_WORKER_PORT:8081}

pacing:
  infrastructure:
    redis:
      key-prefix: pacing
      campaign-cache-ttl: 30s
      campaign-cache-load-lock-ttl: 3s
      campaign-cache-load-wait-timeout: 2s
      campaign-cache-load-retry-interval: 20ms
      recovery-lock-ttl: 5s
      recovery-wait-timeout: 1s
      recovery-retry-interval: 50ms

  worker:
    enabled: true
    processed-event-ttl: ${PACING_WORKER_PROCESSED_EVENT_TTL:1h}
    terminal-reservation-ttl: ${PACING_WORKER_TERMINAL_RESERVATION_TTL:1h}
    kafka:
      billing-topic: billing.events.v1
      consumer-group: pacing-worker-billing-v1
      concurrency: ${PACING_WORKER_KAFKA_CONCURRENCY:6}
      partitions: ${PACING_WORKER_KAFKA_PARTITIONS:12}
      replication-factor: ${PACING_WORKER_KAFKA_REPLICATION_FACTOR:1}
      retry-attempts: ${PACING_WORKER_RETRY_ATTEMPTS:6}
      initial-backoff-millis: ${PACING_WORKER_INITIAL_BACKOFF_MILLIS:1000}
      backoff-multiplier: ${PACING_WORKER_BACKOFF_MULTIPLIER:2.0}
      max-backoff-millis: ${PACING_WORKER_MAX_BACKOFF_MILLIS:60000}

    expiration:
      fixed-delay: ${PACING_WORKER_EXPIRATION_FIXED_DELAY:1s}
      batch-size: ${PACING_WORKER_EXPIRATION_BATCH_SIZE:500}

    reservation-repair:
      enabled: ${PACING_WORKER_RESERVATION_REPAIR_ENABLED:true}
      fixed-delay: ${PACING_WORKER_RESERVATION_REPAIR_FIXED_DELAY:10s}
      grace-period: ${PACING_WORKER_RESERVATION_REPAIR_GRACE_PERIOD:5s}
      batch-size: ${PACING_WORKER_RESERVATION_REPAIR_BATCH_SIZE:500}

    reconciliation:
      enabled: ${PACING_WORKER_RECONCILIATION_ENABLED:true}
      cron: "${PACING_WORKER_RECONCILIATION_CRON:0 10 0 * * *}"
      zone-id: ${PACING_WORKER_RECONCILIATION_ZONE_ID:Asia/Seoul}
      batch-size: ${PACING_WORKER_RECONCILIATION_BATCH_SIZE:500}
      max-repair-attempts: ${PACING_WORKER_RECONCILIATION_MAX_REPAIR_ATTEMPTS:3}

management:
  server:
    port: ${PACING_WORKER_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  metrics:
    tags:
      application: pacing-worker
