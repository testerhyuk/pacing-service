groups:
  - name: pacing-critical
    rules:
      - alert: PacingBudgetOverageDetected
        expr: increase(pacing_worker_billing_overage_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "예산 초과 과금이 감지됨"

      - alert: PacingBudgetMismatchDetected
        expr: increase(pacing_worker_reconciliation_total{outcome="MISMATCHED"}[15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis와 PostgreSQL 예산 상태 불일치가 감지됨"

      - alert: PacingBillingDeadLetterDetected
        expr: increase(pacing_worker_billing_dlt_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "과금 이벤트가 DLT로 이동함"

      - alert: PacingReservationRepairFailure
        expr: increase(pacing_worker_reservation_repair_total{outcome="FAILED"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis 예약 영속화 복구가 실패함"

      - alert: PacingDecisionHighLatency
        expr: histogram_quantile(0.99, sum by (le) (rate(pacing_api_decision_seconds_bucket[5m]))) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "페이싱 판단 API p99가 100ms를 초과함"

      - alert: PacingTargetDown
        expr: up{job=~"pacing-api|pacing-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "페이싱 API 또는 Worker 메트릭 수집 대상이 다운됨"
