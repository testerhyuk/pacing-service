global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: pacing-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:28080

  - job_name: pacing-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081
