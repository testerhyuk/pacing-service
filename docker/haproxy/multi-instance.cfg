global
    log stdout format raw local0
    maxconn 4096
    stats socket ipv4@0.0.0.0:9999 level admin
    stats timeout 5s

defaults
    log global
    mode http
    option httplog
    option http-keep-alive
    timeout connect 1s
    timeout client 15s
    timeout server 15s

frontend pacing_api_frontend
    bind :80
    default_backend pacing_api

backend pacing_api
    balance leastconn
    option httpchk
    http-check send meth GET uri /actuator/health
    http-check expect status 200
    default-server inter 1s fastinter 500ms downinter 500ms fall 1 rise 1
    server pacing-api pacing-api:8080 check
    server pacing-api-2 pacing-api-2:8080 check
    server pacing-api-3 pacing-api-3:8080 check
