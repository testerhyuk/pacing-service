name: pacing-service-data

services:
  postgres:
    image: postgres:16.14-alpine
    container_name: pacing-postgres
    environment:
      POSTGRES_DB: ${PACING_POSTGRES_DATABASE:-pacing}
      POSTGRES_USER: ${PACING_POSTGRES_USERNAME:-pacing}
      POSTGRES_PASSWORD: ${PACING_POSTGRES_PASSWORD:?PACING_POSTGRES_PASSWORD is required}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pacing-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - pacing-data-network

  redis:
    image: redis:7.4.9-alpine
    container_name: pacing-redis
    environment:
      REDIS_PASSWORD: ${PACING_REDIS_PASSWORD:?PACING_REDIS_PASSWORD is required}
      TZ: UTC
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --save ""
        --appendonly yes
        --appendfsync everysec
        --no-appendfsync-on-rewrite yes
        --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "6379:6379"
    volumes:
      - pacing-redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - pacing-data-network

  kafka:
    image: apache/kafka:4.3.1
    container_name: pacing-kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${PACING_DATA_PRIVATE_IP:?PACING_DATA_PRIVATE_IP is required}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      TZ: UTC
    ports:
      - "9092:9092"
    volumes:
      - pacing-kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - pacing-data-network

volumes:
  pacing-postgres-data:
  pacing-redis-data:
  pacing-kafka-data:

networks:
  pacing-data-network:
    driver: bridge
